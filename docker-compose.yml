services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
  backend:
    build: .
    environment:
      MQTT_HOST: mosquitto
      ORION_DB_PATH: /data/orion.db
    volumes: ["orion-data:/data"]
    ports: ["8000:8000"]
    depends_on: [mosquitto]
volumes:
  mosquitto-data:
  orion-data:
